<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - Silver Guide</title>

    <!-- Import Bootstrap CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Apply fonts imported from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">

    <!-- External stylesheet for the website -->
    <link rel="stylesheet" href="./css/styles.css">

    <style>
        .article-hero {
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
        }

        .section-title {
            color: #333;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            border-left: 4px solid #ffc107;
            padding-left: 0.75rem;
        }

        .analogy {
            border-left: 3px dashed #999;
            padding-left: 1rem;
            font-style: italic;
            color: #666;
            margin: 1.5rem 0;
        }

        .tip-box {
            background-color: #e3f2fd;
            border-left: 4px solid #1976d2;
            padding: 1rem;
            border-radius: 4px;
            margin: 1.5rem 0;
        }

        .tip-box strong {
            color: #1565c0;
        }

        .article-content {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #333;
        }

        .article-content p {
            margin-bottom: 1rem;
        }

        .article-content ul,
        .article-content ol {
            margin-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .article-content li {
            margin-bottom: 0.5rem;
        }

        .metadata {
            background-color: #f8f9fa;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .metadata-item {
            margin-bottom: 0.5rem;
        }

        .metadata-label {
            font-weight: 600;
            color: #666;
        }

        .metadata-value {
            color: #333;
        }

        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px;
        }

        .error-container {
            background-color: #fff3cd;
            border: 1px solid #ffc107;
            padding: 2rem;
            border-radius: 8px;
            text-align: center;
        }

        .error-container h3 {
            color: #856404;
        }

        .action-buttons {
            margin-top: 2rem;
            gap: 0.5rem;
        }

        .breadcrumb-custom {
            background-color: #f8f9fa;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 2rem;
        }
    </style>
</head>

<body>
    <!-- Start of Navigation -->
    <nav class="navbar sticky-top navbar-expand-lg navbar-light border-bottom" style="background-color: #f8f9fa;">
        <div class="container">
            <!-- logo -->
            <a class="me-3" href="index.html">
                <img src="./imgs/logo.svg" alt="SilverGuide Logo" width="60" height="60"
                    class="d-inline-block align-text-top">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- links to other pages -->
            <div class="navbar-nav me-auto mb-2 mb-lg-0 collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="nav nav-underline align-items-center mx-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html" data-i18n="nav_home">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="articles.html" data-i18n="nav_learn">Learn</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html" data-i18n="nav_about">About</a>
                    </li>
                </ul>
            </div>

            <!-- login/register buttons -->
            <div class="d-flex align-items-center gap-2">
                <!-- Language Selector -->
                <select id="language-selector" class="form-select form-select-sm" style="width: auto;" onchange="updateLanguage(this.value)">
                    <option value="en">English</option>
                    <option value="zh">中文</option>
                    <option value="ms">Bahasa Melayu</option>
                    <option value="ta">தமிழ்</option>
                </select>
                <a href="login.html" class="btn btn-outline-primary" data-i18n="btn_signin">Sign In</a>
                <a href="register.html" class="btn btn-primary text-white" data-i18n="btn_register">Get Started</a>
            </div>
        </div>
    </nav>


    <!-- Main Content -->
    <main class="container py-5">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="breadcrumb-custom">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="articles.html">Articles</a></li>
                <li class="breadcrumb-item active" id="breadcrumb-title">Article</li>
            </ol>
        </nav>

        <!-- Loading State -->
        <div id="loading-state" class="loading-spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Error State -->
        <div id="error-state" class="error-container" style="display: none;">
            <h3>Article Not Found</h3>
            <p>The article you're looking for doesn't exist or has been deleted.</p>
            <a href="articles.html" class="btn btn-primary mt-2">Back to Articles</a>
        </div>

        <!-- Article Container -->
        <div id="article-container" style="display: none;">
            <!-- Article Header -->
            <div class="row mb-4">
                <div class="col-lg-8 mx-auto">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <h1 id="article-title" class="mb-2"></h1>
                            <span id="article-category" class="badge"></span>
                        </div>
                        <div class="action-buttons d-flex">
                            <button id="edit-btn" class="btn btn-outline-secondary btn-sm" title="Edit">
                                ✏️ Edit
                            </button>
                            <button id="delete-btn" class="btn btn-outline-danger btn-sm" title="Delete">
                                🗑️ Delete
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Hero Image -->
            <div class="row mb-4">
                <div class="col-lg-8 mx-auto">
                    <img id="article-hero" src="" alt="Article hero image" class="article-hero w-100">
                </div>
            </div>

            <!-- Metadata -->
            <div class="row mb-4">
                <div class="col-lg-8 mx-auto">
                    <div class="metadata">
                        <div class="metadata-item">
                            <span class="metadata-label">Author:</span>
                            <span class="metadata-value" id="article-author"></span>
                        </div>
                        <div class="metadata-item">
                            <span class="metadata-label">Published:</span>
                            <span class="metadata-value" id="article-date"></span>
                        </div>
                        <div class="metadata-item">
                            <span class="metadata-label">Description:</span>
                            <span class="metadata-value" id="article-description"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Article Content -->
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="article-content" id="article-content">
                        <!-- Rendered content will go here -->
                    </div>
                </div>
            </div>

            <!-- Back Button -->
            <div class="row mt-5">
                <div class="col-lg-8 mx-auto">
                    <a href="articles.html" class="btn btn-outline-primary">← Back to Articles</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-light border-top mt-5 py-4">
        <div class="container text-center">
            <p class="text-muted mb-0" data-i18n="footer_copyright">&copy; 2024 Silver Guide. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-7I7zVm3vNvpZ8E3wN2l4nGiYpJYhQQN5vqgYb+KV5Y4TFBS0pWPVEcVRQDI4" crossorigin="anonymous">
    </script>

    <!-- i18n Language Support -->
    <script src="./js/i18n.js"></script>

    <!-- Article Controller & Renderer -->
    <script src="./js/article-controller.js"></script>
    <script src="./js/article-view.js"></script>
</body>

</html>
