    <!-- TODO Start of Article Form -->
    <section class="container py-4">
        <div class="py-3 text-center">
            <h2>Create an article</h2>
        </div>
        <div class="row g-5">
            <!-- TODO right side of article form page -->
            <div class="col-md-5 col-lg-4 order-md-last">
                <!-- card -->
                <div class="card p-3">
                    <!-- category selection option -->
                    <div class="mb-3">
                        <h6>Category:</h6>
                        <select class="form-select" aria-label="Default select example">
                            <option selected>Select a topic</option>
                            <option value="1">Topic1</option>
                            <option value="2">Topic2</option>
                            <option value="3">Topic3</option>
                            <option value="4">Topic4</option>
                        </select>
                    </div>

                    <!-- author selection option -->
                    <div class="mb-3">
                        <h6>Author:</h6>
                        <select class="form-select" aria-label="Default select example">
                            <option selected>Select an option</option>
                            <option value="1">Name1</option>
                            <option value="2">Name2</option>
                            <option value="3">Name3</option>
                            <option value="4">Name4</option>
                        </select>
                    </div>

                    <!-- buttons - draft or publish -->
                    <div class="d-grid gap-2 d-md-block">
                        <button class="btn btn-outline-secondary" type="button">Save as draft</button>
                        <button class="btn btn-primary" type="button">Publish</button>
                    </div>
                </div>
            </div>

            <!-- left side of article form page  -->
            <div class="card py-4 col-md-7 col-lg-8">
                <form class="needs-validation" novalidate="">
                    <!-- subheader text area-->
                    <div class="mb-3">
                        <label for="formGroupExampleInput" class="form-label">Subheader:</label>
                        <input type="text" class="form-control" id="formGroupExampleInput" placeholder="">
                    </div>
                    <!-- header text area -->
                    <div class="mb-3">
                        <label for="formGroupExampleInput2" class="form-label">Header:</label>
                        <input type="text" class="form-control" id="formGroupExampleInput2" placeholder="">
                    </div>
                    <!-- short content description -->
                    <div class="form-floating mb-3">
                        <textarea class="form-control" placeholder="Include short a description here" id="floatingTextarea"></textarea>
                        <label for="floatingTextarea">Add a short summary of your article here</label>
                    </div>
                    <!-- featured image -->
                    <div class="input-group mb-3">
                        <input type="file" class="form-control" id="inputGroupFile02">
                        <label class="input-group-text" for="inputGroupFile02">Upload</label>
                    </div>
                    <!-- content -->
