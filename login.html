<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silver Guide - Sign In</title>

    <!-- Import Bootstrap CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Apply fonts imported from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">

    <!-- External stylesheet for the website -->
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body style="background-color: #f8f9fa;">

    <div class="min-vh-100 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                    <!-- Back button -->
                    <a href="index.html" class="btn btn-outline-secondary btn-sm mb-3">
                        &larr; Back to Home
                    </a>

                    <!-- Card -->
                    <div class="bg-white p-5"
                        style="border-radius: 2rem; box-shadow: 0 1rem 3rem rgba(0,0,0,0.05);">

                        <!-- Logo + Heading -->
                        <div class="text-center mb-4">
                            <a href="index.html">
                                <img src="./imgs/logo.svg" alt="SilverGuide Logo" width="64" height="64">
                            </a>
                            <h1 class="h3 fw-bold mt-3 mb-0">Silver Guide</h1>
                        </div>

                        <!-- Section title with lime accent -->
                        <div class="mb-4" style="border-left: 5px solid #dfff6f; padding-left: 1rem;">
                            <h2 class="h5 fw-bold mb-0">Welcome Back</h2>
                            <p class="text-muted small mb-0">Sign in to your account</p>
                        </div>

                        <!-- Error alert (hidden by default) -->
                        <div id="errorAlert" class="alert alert-danger alert-dismissible d-none" role="alert">
                            <span id="errorMessage"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <!-- Login Form -->
                        <form id="loginForm" novalidate>
                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold">Email address</label>
                                <input type="email" class="form-control form-control-lg" id="email"
                                    placeholder="you@example.com" required autocomplete="email">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label fw-bold">Password</label>
                                <input type="password" class="form-control form-control-lg" id="password"
                                    placeholder="Enter your password" required autocomplete="current-password">
                            </div>

                            <button type="submit" id="submitBtn" class="btn btn-primary btn-lg w-100 mt-2">
                                <span id="btnText">Sign In</span>
                                <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none"
                                    role="status" aria-hidden="true"></span>
                            </button>
                        </form>

                    </div>

                    <!-- Register link below card -->
                    <p class="text-center mt-4 text-muted">
                        Don't have an account?
                        <a href="register.html" class="fw-bold text-decoration-none">Register &rarr;</a>
                    </p>

                </div>
            </div>
        </div>
    </div>

    <!-- Import Bootstrap javascript library -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        const API = 'http://localhost:8080';

        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');

        function showError(msg) {
            errorMessage.textContent = msg;
            errorAlert.classList.remove('d-none');
        }

        function setLoading(loading) {
            submitBtn.disabled = loading;
            btnText.textContent = loading ? 'Signing in…' : 'Sign In';
            btnSpinner.classList.toggle('d-none', !loading);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorAlert.classList.add('d-none');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            setLoading(true);
            try {
                const res = await fetch(`${API}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (res.ok) {
                    const data = await res.json();
                    sessionStorage.setItem('sg_token', data.token);
                    sessionStorage.setItem('sg_user', JSON.stringify({
                        userId: data.userId,
                        name: data.name,
                        email: data.email
                    }));
                    window.location.href = 'index.html';
                } else if (res.status === 401) {
                    showError('Invalid email or password.');
                } else {
                    showError('Something went wrong. Please try again.');
                }
            } catch (err) {
                showError('Could not connect to the server. Please check your connection.');
            } finally {
                setLoading(false);
            }
        });
    </script>

</body>

</html>
