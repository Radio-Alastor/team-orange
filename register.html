<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silver Guide - Register</title>

    <!-- Import Bootstrap CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Apply fonts imported from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">

    <!-- External stylesheet for the website -->
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body style="background-color: #f8f9fa;">

    <div class="min-vh-100 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                    <!-- Back button -->
                    <a href="index.html" class="btn btn-outline-secondary btn-sm mb-3">
                        &larr; Back to Home
                    </a>

                    <!-- Card -->
                    <div class="bg-white p-5"
                        style="border-radius: 2rem; box-shadow: 0 1rem 3rem rgba(0,0,0,0.05);">

                        <!-- Logo + Heading -->
                        <div class="text-center mb-4">
                            <a href="index.html">
                                <img src="./imgs/logo.svg" alt="SilverGuide Logo" width="64" height="64">
                            </a>
                            <h1 class="h3 fw-bold mt-3 mb-0">Silver Guide</h1>
                        </div>

                        <!-- Section title with blue accent -->
                        <div class="mb-4" style="border-left: 5px solid #75adf6; padding-left: 1rem;">
                            <h2 class="h5 fw-bold mb-0">Create Your Account</h2>
                            <p class="text-muted small mb-0">Join Silver Guide today — it's free</p>
                        </div>

                        <!-- Error alert (hidden by default) -->
                        <div id="errorAlert" class="alert alert-danger alert-dismissible d-none" role="alert">
                            <span id="errorMessage"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <!-- Register Form -->
                        <form id="registerForm" novalidate>
                            <div class="mb-3">
                                <label for="name" class="form-label fw-bold">Full Name</label>
                                <input type="text" class="form-control form-control-lg" id="name"
                                    placeholder="Your name" required autocomplete="name">
                                <div class="invalid-feedback">Please enter your name.</div>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold">Email address</label>
                                <input type="email" class="form-control form-control-lg" id="email"
                                    placeholder="you@example.com" required autocomplete="email">
                                <div class="invalid-feedback">Please enter a valid email address.</div>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label fw-bold">Password</label>
                                <input type="password" class="form-control form-control-lg" id="password"
                                    placeholder="Create a password" required minlength="8"
                                    autocomplete="new-password">
                                <div class="form-text">Must be at least 8 characters.</div>
                                <div class="invalid-feedback">Password must be at least 8 characters.</div>
                            </div>
                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label fw-bold">Confirm Password</label>
                                <input type="password" class="form-control form-control-lg" id="confirmPassword"
                                    placeholder="Repeat your password" required autocomplete="new-password">
                                <div class="invalid-feedback" id="confirmFeedback">Passwords do not match.</div>
                            </div>

                            <button type="submit" id="submitBtn" class="btn btn-primary btn-lg w-100">
                                <span id="btnText">Create Account</span>
                                <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none"
                                    role="status" aria-hidden="true"></span>
                            </button>
                        </form>

                    </div>

                    <!-- Login link below card -->
                    <p class="text-center mt-4 text-muted">
                        Already have an account?
                        <a href="login.html" class="fw-bold text-decoration-none">Sign In &rarr;</a>
                    </p>

                </div>
            </div>
        </div>
    </div>

    <!-- Import Bootstrap javascript library -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        const API = 'http://localhost:8080';

        const form = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');

        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');

        function showError(msg) {
            errorMessage.textContent = msg;
            errorAlert.classList.remove('d-none');
        }

        function setLoading(loading) {
            submitBtn.disabled = loading;
            btnText.textContent = loading ? 'Creating account…' : 'Create Account';
            btnSpinner.classList.toggle('d-none', !loading);
        }

        function clearFieldErrors() {
            [nameInput, emailInput, passwordInput, confirmInput].forEach(el => {
                el.classList.remove('is-invalid');
            });
        }

        function setFieldError(input, message) {
            input.classList.add('is-invalid');
            if (message) {
                input.nextElementSibling.textContent = message;
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorAlert.classList.add('d-none');
            clearFieldErrors();

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirm = confirmInput.value;

            // Client-side validation
            let valid = true;

            if (!name) {
                setFieldError(nameInput, 'Please enter your name.');
                valid = false;
            }
            if (!email || !emailInput.validity.valid) {
                setFieldError(emailInput, 'Please enter a valid email address.');
                valid = false;
            }
            if (password.length < 8) {
                setFieldError(passwordInput, 'Password must be at least 8 characters.');
                valid = false;
            }
            if (password !== confirm) {
                setFieldError(confirmInput, 'Passwords do not match.');
                valid = false;
            }

            if (!valid) return;

            setLoading(true);
            try {
                const res = await fetch(`${API}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                if (res.status === 201) {
                    const data = await res.json();
                    sessionStorage.setItem('sg_token', data.token);
                    sessionStorage.setItem('sg_user', JSON.stringify({
                        userId: data.userId,
                        name: data.name,
                        email: data.email
                    }));
                    window.location.href = 'index.html';
                } else if (res.status === 409) {
                    showError('An account with that email already exists.');
                } else if (res.status === 400) {
                    // Parse ProblemDetail field errors
                    const body = await res.json();
                    const errors = body.errors;
                    if (errors) {
                        if (errors.name) setFieldError(nameInput, errors.name);
                        if (errors.email) setFieldError(emailInput, errors.email);
                        if (errors.password) setFieldError(passwordInput, errors.password);
                    } else {
                        showError(body.detail || 'Please check your input and try again.');
                    }
                } else {
                    showError('Something went wrong. Please try again.');
                }
            } catch (err) {
                showError('Could not connect to the server. Please check your connection.');
            } finally {
                setLoading(false);
            }
        });
    </script>

</body>

</html>
